<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Observatory</title>
<style>
:root{
  color-scheme:dark;
  --bg:#020617;--panel:#0b1222;--panel-2:#0f172a;--line:#1e293b;--line-2:#27354d;
  --text:#e2e8f0;--muted:#8a9ab3;--faint:#55657e;
  --llm:#5ad1e6;--llm-bg:rgba(90,209,230,.08);
  --tool:#f5c35b;--tool-bg:rgba(245,195,91,.08);
  --user:#a78bfa;--user-bg:rgba(167,139,250,.09);
  --ok:#4ade80;--err:#fb7185;--err-bg:rgba(251,113,133,.09);
  --accent:#38bdf8;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f8fafc;--panel:#ffffff;--panel-2:#f1f5f9;--line:#e2e8f0;--line-2:#cbd5e1;
  --text:#0f172a;--muted:#55657e;--faint:#94a3b8;
  --llm:#0e7490;--llm-bg:rgba(14,116,144,.07);
  --tool:#a16207;--tool-bg:rgba(161,98,7,.07);
  --user:#6d28d9;--user-bg:rgba(109,40,217,.06);
  --ok:#15803d;--err:#be123c;--err-bg:rgba(190,18,60,.06);
  --accent:#0284c7;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
header{height:56px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.pill{font:600 11px/1 var(--mono);padding:5px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pill.live{color:var(--accent);border-color:var(--accent)}
.stats{display:flex;gap:14px;margin-left:auto;color:var(--muted);font:12px var(--mono);white-space:nowrap}
.stats b{color:var(--text);font-weight:600}
#task-form{display:flex;gap:6px;min-width:0}
#task-form input{font:inherit;font-size:12px;color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;width:280px;min-width:0}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);height:calc(100vh - 56px)}
section{min-width:0;min-height:0;display:flex;flex-direction:column}
.diagram{border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.bar strong{color:var(--text);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:650}
.loop{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
.loop:active{cursor:grabbing}
.loop .canvas{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content}
.loop .empty{padding:28px}
.loop .hit rect,.loop .hit path,.loop .hit polygon,.loop .hit circle{stroke:var(--accent)!important;stroke-width:3px!important}
.row.at{cursor:pointer}
select,button{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;min-width:0}
select{flex:1;max-width:320px;font-size:12px}
button{cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs button{border:0;background:none;padding:6px 10px;color:var(--muted);border-radius:6px;font-size:12px}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--text)}
.ghost{background:none;font-size:12px}
.scroll{flex:1;overflow:auto;padding:14px}
.empty{color:var(--muted);padding:28px 6px;text-align:center}
.step{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.step.err{border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
.step-head{display:flex;align-items:baseline;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.step-head .n{font:650 12px var(--mono)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;margin:8px 12px;padding:8px 10px;border-radius:7px}
.row.llm{background:var(--llm-bg)}
.row.tool{background:var(--tool-bg)}
.row.user{background:var(--user-bg)}
.row.error{background:var(--err-bg)}
.tag{font:700 10.5px/20px var(--mono);letter-spacing:.06em}
.row.llm .tag{color:var(--llm)}
.row.tool .tag{color:var(--tool)}
.row.user .tag{color:var(--user)}
.row.error .tag{color:var(--err)}
.main{min-width:0}
.title{font:600 12.5px var(--mono);overflow-wrap:anywhere}
.detail{margin-top:3px;font:12px/1.55 var(--mono);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.detail.err{color:var(--err)}
details.field{margin-top:4px}
details.field summary{cursor:pointer;font:12px var(--mono);color:var(--muted)}
details.field pre.code{max-height:70vh;resize:vertical}
pre.code{margin:6px 0 0;padding:8px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font:12px/1.55 var(--mono);color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
.meta{font:12px var(--mono);color:var(--faint);white-space:nowrap;text-align:right}
.status{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;background:var(--faint);vertical-align:1px}
.status.ok{background:var(--ok)}.status.err{background:var(--err)}.status.pending{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.log{display:grid;grid-template-columns:70px 56px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font:12px/1.55 var(--mono)}
.log .t{color:var(--faint)}.log .k{font-weight:700;color:var(--muted)}
.log .k.llm{color:var(--llm)}.log .k.tool{color:var(--tool)}.log .k.user{color:var(--user)}.log.error .m{color:var(--err)}
.log .m{white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:980px){
  header{height:auto;flex-wrap:wrap;padding:10px 16px;gap:8px 12px}
  .stats{margin-left:0;flex-wrap:wrap}
  .layout{grid-template-columns:1fr;height:auto}
  .diagram{border-right:0;border-bottom:1px solid var(--line)}
  .loop{height:60vh;flex:none}
  .runtime{min-height:80vh}
}
</style>
</head>
<body>
<header>
  <h1>Agent Observatory</h1>
  <span id="status" class="pill">no run</span>
  <div class="stats">
    <span>steps <b id="s-steps">0</b></span>
    <span>LLM <b id="s-llm">0</b></span>
    <span>tools <b id="s-tools">0</b></span>
    <span>user <b id="s-user">0</b></span>
    <span>cost <b id="s-cost">$0.000</b></span>
    <span>errors <b id="s-errors">0</b></span>
  </div>
  <form id="task-form" hidden>
    <input id="task" placeholder="Task for the agent" aria-label="Task" required>
    <button type="submit">Run</button>
  </form>
</header>
<main class="layout">
  <section class="diagram">
    <div class="bar"><strong>Agent loop</strong><span>from the code · wheel to zoom, drag to move, double-click to fit · click a box to open its code</span></div>
    <div id="loop" class="loop" title="wheel: zoom · drag: move · double-click: fit"></div>
  </section>
  <section class="runtime">
    <div class="bar">
      <select id="run" aria-label="Run"></select>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-view="timeline">Call history</button>
        <button role="tab" aria-selected="false" data-view="raw">Raw events</button>
      </div>
      <a id="export" href="/api/trace" download><button class="ghost" type="button" tabindex="-1">Export JSON</button></a>
    </div>
    <div id="timeline" class="scroll"></div>
    <div id="raw" class="scroll" hidden></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const timelineEl = $('#timeline'), rawEl = $('#raw'), runSel = $('#run');
const EMPTY = '에이전트를 OBSERVATORY_RUNS 환경변수와 함께 실행하면 step마다 LLM 호출과 tool 실행 이력이 여기에 쌓입니다.';
const USER = 'user_input';  // agents report user input as this tool action
let state = null, stream = null, followLatest = true;
const opened = new Set();  // expanded fields, kept across re-renders
const loopEl = $('#loop'), atNode = {};  // a logger call's `path:line` -> the [LOG] box drawn for it
const MERMAID = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';

// The agent loop the checker drew from the code (verify/loop.mmd). A box with `[LOG] <event> @ <path:line>` lines is
// marked by the events those logger calls report, and opens its first one in VS Code.
async function drawLoop() {
  const r = await fetch('/api/loop');
  if (!r.ok) { loopEl.append(el('div', 'empty', 'No diagram yet: observatory/run.py has the checker draw verify/loop.mmd.')); return; }
  const g = await r.json();
  try {
    const {default: mermaid} = await import(MERMAID);
    mermaid.initialize({
      startOnLoad: false, securityLevel: 'loose',
      theme: matchMedia('(prefers-color-scheme: light)').matches ? 'default' : 'dark',
      flowchart: {useMaxWidth: false, wrappingWidth: 1000},  // natural size, labels on one line: zoom instead
    });
    loopEl.innerHTML = `<div class="canvas">${(await mermaid.render('loop-svg', g.mermaid)).svg}</div>`;
  } catch (error) {
    loopEl.append(el('div', 'empty', `The diagram could not be drawn (${error.message}).`), el('pre', 'code', g.mermaid));
    return;
  }
  const view = panZoom(loopEl, loopEl.firstElementChild);
  for (const node of loopEl.querySelectorAll('g.node')) {
    const ats = [...node.textContent.matchAll(/\[LOG\][^@]*@\s*(\S+?:\d+)/g)].map(m => m[1]);
    if (!ats.length) continue;
    for (const at of ats) atNode[at] = node;
    node.style.cursor = 'pointer';
    node.addEventListener('click', () => { if (!view.dragged()) location.href = `vscode://file/${g.root}/${ats[0]}`; });
  }
}

// Wheel to zoom around the pointer, drag to move, double-click to fit the panel again.
function panZoom(frame, canvas) {
  let s = 1, x = 0, y = 0, drag = null, moved = false;
  const apply = () => { canvas.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };
  const fit = () => {
    const w = canvas.scrollWidth, h = canvas.scrollHeight;
    s = Math.min(frame.clientWidth / w, frame.clientHeight / h, 1);
    x = (frame.clientWidth - w * s) / 2; y = 12;
    apply();
  };
  frame.addEventListener('wheel', e => {
    e.preventDefault();
    const r = frame.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.min(Math.max(s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 0.1), 8) / s;
    x = mx - (mx - x) * k; y = my - (my - y) * k; s *= k;
    apply();
  }, {passive: false});
  frame.addEventListener('pointerdown', e => { drag = {x: e.clientX - x, y: e.clientY - y, sx: e.clientX, sy: e.clientY}; moved = false; });
  addEventListener('pointermove', e => {
    if (!drag) return;
    moved ||= Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4;
    x = e.clientX - drag.x; y = e.clientY - drag.y;
    apply();
  });
  addEventListener('pointerup', () => { drag = null; });
  frame.addEventListener('dblclick', fit);
  fit();
  return {dragged: () => moved};
}

// Mark the box whose [LOG] line reported an event (its `at`, relative to the agent or absolute).
function highlight(at) {
  const key = at && Object.keys(atNode).find(k => at === k || at.endsWith('/' + k) || k.endsWith('/' + at));
  if (!key) return;
  loopEl.querySelectorAll('.hit').forEach(n => n.classList.remove('hit'));
  atNode[key].classList.add('hit');
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
const fmtDur = s => s == null ? '' : s < 1 ? `${Math.round(s * 1000)}ms` : `${s.toFixed(2)}s`;
const fmtTime = t => new Date(t * 1000).toLocaleTimeString('ko-KR', {hour12: false});
const text = v => typeof v === 'string' ? v : JSON.stringify(v, null, 2);
const short = (v, n = 160) => { const s = typeof v === 'string' ? v : JSON.stringify(v); return s.length > n ? s.slice(0, n) + '…' : s; };

// small fields as key=value chips, large ones (objects, long text) as expandable full JSON
function fields(main, ev, skip) {
  const chips = [];
  for (const [k, v] of Object.entries(ev.data)) {
    if (skip.includes(k) || v == null || v === '') continue;
    const s = text(v);
    if (typeof v !== 'object' && s.length <= 120) { chips.push(`${k}=${s}`); continue; }
    const key = `${ev.seq}:${k}`, d = el('details', 'field');
    d.open = opened.has(key);
    d.addEventListener('toggle', () => d.open ? opened.add(key) : opened.delete(key));
    d.append(el('summary', null, `${k}${Array.isArray(v) ? ` (${v.length})` : ''} · ${s.length.toLocaleString()} chars`), el('pre', 'code', s));
    main.append(d);
  }
  if (chips.length) main.append(el('div', 'detail', chips.join('  ')));
}

function resetState(id) {
  state = {id, steps: new Map(), order: [], raw: [], counts: {llm: 0, tool: 0, user: 0, errors: 0, cost: 0}};
  render();
}

function stepOf(n) {
  const key = n ?? 0;
  if (!state.steps.has(key)) { state.steps.set(key, {n: key, llm: [], tools: []}); state.order.push(key); }
  return state.steps.get(key);
}

function apply(ev) {
  state.raw.push(ev);
  highlight(ev.at);
  const d = ev.data || {};
  if (ev.kind === 'llm_query') { state.counts.llm++; stepOf(ev.step).llm.push({query: ev, response: null, error: null}); }
  else if (ev.kind === 'llm_response' || ev.kind === 'llm_error') {
    const call = stepOf(ev.step).llm.findLast(c => !c.response && !c.error);
    if (call) call[ev.kind === 'llm_error' ? 'error' : 'response'] = ev;
    if (ev.kind === 'llm_error') state.counts.errors++;
    if (typeof d.cost === 'number') state.counts.cost += d.cost;
  } else if (ev.kind === 'tool_start') { state.counts[d.action === USER ? 'user' : 'tool']++; stepOf(ev.step).tools.push({start: ev, end: null}); }
  else if (ev.kind === 'user_input') {  // one event: shown like a finished user_input action
    state.counts.user++;
    stepOf(ev.step).tools.push({start: {...ev, data: {action: USER, params: d.prompt}}, end: {...ev, kind: 'tool_end', data: {action: USER, result: d.answer}}});
  }
  else if (ev.kind === 'tool_end' || ev.kind === 'tool_error') {
    const t = stepOf(ev.step).tools.findLast(x => !x.end && x.start.data.action === d.action);
    if (t) t.end = ev;
    if (ev.kind === 'tool_error') state.counts.errors++;
  }
  scheduleRender();
}

let pending = false;
function scheduleRender() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }

function render() {
  $('#s-steps').textContent = state.order.filter(k => state.steps.get(k).llm.length).length;
  $('#s-llm').textContent = state.counts.llm;
  $('#s-tools').textContent = state.counts.tool;
  $('#s-user').textContent = state.counts.user;
  $('#s-cost').textContent = `$${state.counts.cost.toFixed(3)}`;
  $('#s-errors').textContent = state.counts.errors;
  const stick = timelineEl.scrollHeight - timelineEl.scrollTop - timelineEl.clientHeight < 40;
  timelineEl.replaceChildren();
  if (!state.id) timelineEl.append(el('div', 'empty', EMPTY));
  else for (const key of state.order) timelineEl.append(renderStep(state.steps.get(key)));
  if (stick) timelineEl.scrollTop = timelineEl.scrollHeight;
  renderRaw();
}

// One reported action: `{name: arguments}` is shown as the name plus its arguments, anything else as JSON.
function actionView(a) {
  const keys = a && typeof a === 'object' ? Object.keys(a) : [];
  if (keys.length !== 1) return [null, text(a)];
  const v = a[keys[0]];
  return [keys[0], v == null ? '' : text(v)];
}

function llmRow(c) {
  const q = c.query.data, r = c.response?.data, row = el('div', `row ${c.error ? 'error' : 'llm'}`), main = el('div', 'main');
  const count = Array.isArray(q.messages) ? q.messages.length : q.messages;
  const head = [q.model, count != null ? `${count} messages` : null].filter(Boolean).join(' · ');
  main.append(el('div', 'title', head || 'model call'));
  fields(main, c.query, ['model']);
  for (const a of r?.actions || []) {
    const [name, args] = actionView(a);
    if (name) main.append(el('div', 'title', name));
    if (args) main.append(el('pre', 'code', args));
  }
  if (r && !r.actions.length) main.append(el('div', 'detail', '→ no action'));
  if (r) fields(main, c.response, ['actions', 'cost', 'duration_seconds']);
  if (c.error) main.append(el('div', 'detail err', `${c.error.data.error_type}: ${short(c.error.data.error, 400)}`));
  const cost = r && typeof r.cost === 'number' && r.cost ? `$${r.cost.toFixed(4)} · ` : '';
  const meta = el('div', 'meta', r ? cost + fmtDur(r.duration_seconds) : c.error ? fmtDur(c.error.data.duration_seconds) : '');
  meta.append(el('span', `status ${c.response ? 'ok' : c.error ? 'err' : 'pending'}`));
  row.append(el('span', 'tag', 'LLM'), main, meta);
  return pointsAt(row, c.query.at);
}

function toolRow(t) {
  const s = t.start.data, e = t.end?.data, failed = t.end?.kind === 'tool_error';
  const user = s.action === USER, row = el('div', `row ${failed ? 'error' : user ? 'user' : 'tool'}`), main = el('div', 'main');
  main.append(el('div', 'title', s.action));
  const p = s.params, keys = p && typeof p === 'object' ? Object.keys(p) : [];
  const shown = p == null ? '' : keys.length === 1 && typeof p[keys[0]] === 'string' ? p[keys[0]] : text(p);
  if (shown) main.append(el('pre', 'code', shown));
  if (failed) main.append(el('div', 'detail err', `${e.error_type}: ${short(e.error, 400)}`));
  else if (e && e.result != null) main.append(el('div', 'detail', `→ ${short(e.result, 400)}`));
  if (e && !failed && text(e.result ?? '').length > 400) fields(main, {seq: t.end.seq, data: {result: e.result}}, []);
  if (e) fields(main, t.end, ['action', 'result', 'duration_seconds', 'error', 'error_type']);
  const meta = el('div', 'meta', e ? fmtDur(e.duration_seconds) : '');
  meta.append(el('span', `status ${failed ? 'err' : t.end ? 'ok' : 'pending'}`));
  row.append(el('span', 'tag', user ? 'USER' : 'TOOL'), main, meta);
  return pointsAt(row, t.start.at);
}

function pointsAt(row, at) {
  if (!at) return row;
  row.classList.add('at');
  row.title = at;
  row.addEventListener('click', e => { if (!e.target.closest('details')) highlight(at); });
  return row;
}

function renderStep(s) {
  const failed = s.llm.some(c => c.error) || s.tools.some(t => t.end?.kind === 'tool_error');
  const box = el('div', `step${failed ? ' err' : ''}`), head = el('div', 'step-head');
  head.append(el('span', 'n', s.n === 0 ? 'Before step 1' : `Step ${s.n}`));
  box.append(head);
  for (const c of s.llm) box.append(llmRow(c));
  for (const t of s.tools) box.append(toolRow(t));
  return box;
}

function renderRaw() {
  if (rawEl.hidden) return;
  rawEl.replaceChildren(...state.raw.map(ev => {
    const kind = ev.kind.startsWith('llm') ? 'llm' : ev.kind === USER || ev.data?.action === USER ? 'user' : 'tool';
    const row = el('div', `log${ev.kind.endsWith('error') ? ' error' : ''}`);
    row.append(el('span', 't', fmtTime(ev.t)), el('span', `k ${kind}`, kind.toUpperCase()), el('span', 'm', `${ev.kind}${ev.step != null ? ` step=${ev.step}` : ''}${ev.at ? ` @ ${ev.at}` : ''}\n${JSON.stringify(ev.data)}`));
    return row;
  }));
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  timelineEl.hidden = b.dataset.view !== 'timeline';
  rawEl.hidden = b.dataset.view !== 'raw';
  render();
}));

function openRun(id) {
  if (stream) stream.close();
  resetState(id);
  $('#export').href = `/api/trace?run=${encodeURIComponent(id)}`;
  stream = new EventSource(`/api/events?run=${encodeURIComponent(id)}`);
  stream.onmessage = e => apply(JSON.parse(e.data));
}

async function refreshRuns() {
  const runs = await (await fetch('/api/runs')).json();
  if (document.activeElement !== runSel) runSel.replaceChildren(...runs.map(r => { const o = el('option', null, `${r.id} · ${r.events} events${r.live ? ' · live' : ''}`); o.value = r.id; return o; }));
  const latest = runs[0];
  const pill = $('#status');
  if (!latest) { pill.textContent = 'no run'; pill.className = 'pill'; return; }
  if (followLatest && state.id !== latest.id) openRun(latest.id);
  if (document.activeElement !== runSel) runSel.value = state.id;
  const current = runs.find(r => r.id === state.id);
  pill.textContent = current?.live ? 'live' : 'idle';
  pill.className = `pill${current?.live ? ' live' : ''}`;
}

runSel.addEventListener('change', () => { followLatest = runSel.selectedIndex === 0; openRun(runSel.value); });
$('#task-form').addEventListener('submit', async e => {
  e.preventDefault();
  await fetch('/api/run', {method: 'POST', body: JSON.stringify({task: $('#task').value})});
  $('#task').value = '';
  followLatest = true;
});
fetch('/api/agent').then(r => r.json()).then(a => { $('#task-form').hidden = !a.enabled; });
resetState(null);
drawLoop().then(refreshRuns);
setInterval(refreshRuns, 2000);
</script>
</body>
</html>
